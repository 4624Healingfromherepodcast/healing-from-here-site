<header class="hero">
  <div class="wrap inner">
    <div class="rule"></div>
    <div class="lockup">
      <p class="kicker">Get in touch</p>
      <h1>Be a guest, or just say hello.</h1>
      <p class="lede">Guest pitches, sponsorship questions, and listener notes all land in the same inbox.</p>
    </div>
  </div>
</header>

<section>
  <div class="wrap">
    <!--
      This form opens the visitor's email client with the fields
      filled in — no server or form service needed on GoDaddy shared
      hosting. Replace YOUREMAIL@domain.com with your real address.
      If you'd rather capture submissions directly, swap this for a
      form endpoint from a service like Formspree.
    -->
    <form action="mailto:YOUREMAIL@domain.com" method="post" enctype="text/plain">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required />
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit" class="btn btn-gold">Send message</button>
    </form>
  </div>
</section>
